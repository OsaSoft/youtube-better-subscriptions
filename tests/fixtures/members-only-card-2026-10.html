<!-- Members-only video card (channel videos page, 2026-10 layout), anonymized and stripped of noise.
     The "Members only" badge is a ytBadgeShapeCommerce badge in the metadata row, not on the thumbnail. -->
<ytd-rich-item-renderer class="style-scope ytd-rich-grid-renderer" items-per-row="3" lockup="true" rendered-from-rich-grid="">
    <div id="content" class="style-scope ytd-rich-item-renderer">
        <yt-lockup-view-model class="ytd-rich-item-renderer lockup ytLockupViewModelWrapper">
            <div class="ytLockupViewModelHost ytLockupViewModelVertical content-id-memberVid01">
                <a href="/watch?v=memberVid01" class="ytLockupViewModelContentImage" tabindex="-1" aria-hidden="true">
                    <yt-thumbnail-view-model class="ytThumbnailViewModelHost ytThumbnailViewModelAspectRatio16By9">
                        <div class="ytThumbnailViewModelImage"><img class="ytCoreImageHost" alt="" src=""></div>
                        <yt-thumbnail-bottom-overlay-view-model class="ytThumbnailBottomOverlayViewModelHost">
                            <div class="ytThumbnailBottomOverlayViewModelBadgeContainer">
                                <yt-thumbnail-badge-view-model class="ytThumbnailBadgeViewModelHost ytThumbnailBottomOverlayViewModelBadge">
                                    <badge-shape class="ytBadgeShapeHost ytBadgeShapeThumbnailDefault ytBadgeShapeThumbnailBadge ytBadgeShapeModern ytBadgeShapeTypography" role="img" aria-label="57 seconds">
                                        <div class="ytBadgeShapeText" aria-hidden="true">0:57</div>
                                    </badge-shape>
                                </yt-thumbnail-badge-view-model>
                            </div>
                        </yt-thumbnail-bottom-overlay-view-model>
                    </yt-thumbnail-view-model>
                </a>
                <div class="ytLockupViewModelMetadata">
                    <yt-lockup-metadata-view-model class="ytLockupMetadataViewModelHost ytLockupMetadataViewModelVertical">
                        <div class="ytLockupMetadataViewModelTextContainer">
                            <h3 class="ytLockupMetadataViewModelHeadingReset" title="Members Video" aria-label="Members Video">
                                <a href="/watch?v=memberVid01" class="ytLockupMetadataViewModelTitle"><span class="ytAttributedStringHost">Members Video</span></a>
                            </h3>
                            <div class="ytLockupMetadataViewModelMetadata">
                                <yt-content-metadata-view-model class="ytContentMetadataViewModelHost ytContentMetadataViewModelMediumText">
                                    <div class="ytContentMetadataViewModelMetadataRow" role="group">
                                        <span class="ytAttributedStringHost ytContentMetadataViewModelMetadataText" aria-label="6 hours ago" role="text">6 hr ago</span>
                                    </div>
                                    <div class="ytContentMetadataViewModelMetadataRow ytContentMetadataViewModelMetadataRowMetadataRowWrap" role="group">
                                        <div class="ytContentMetadataViewModelBadge">
                                            <yt-badge-view-model class="ytBadgeViewModelHost">
                                                <badge-shape class="ytBadgeShapeHost ytBadgeShapeCommerce ytBadgeShapeModern ytBadgeShapeTypography">
                                                    <div class="ytBadgeShapeIcon"><span class="yt-icon-shape ytSpecIconShapeHost"></span></div>
                                                    <div class="ytBadgeShapeText">Members only</div>
                                                </badge-shape>
                                            </yt-badge-view-model>
                                        </div>
                                    </div>
                                </yt-content-metadata-view-model>
                            </div>
                        </div>
                    </yt-lockup-metadata-view-model>
                </div>
            </div>
        </yt-lockup-view-model>
    </div>
</ytd-rich-item-renderer>
