on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

name: Upload Release Asset

jobs:
  build:
    name: Upload Release Asset
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate manifest.json (Chrome MV3) # should be compatible with Firefox too
        uses: cardinalby/schema-validator-action@v3
        with:
          file: manifest.json
          schema: https://json.schemastore.org/chrome-manifest
          fixSchemas: true          # <-- handles custom formats like "match-pattern"

      - name: Check the tag matches the manifest version
        run: |
          version=$(jq -r .version manifest.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match manifest.json version $version"
            exit 1
          fi

      - name: Pack extension ZIP
        # Directory patterns need the trailing /*: zip -x matches file paths, not directory names
        run: |
          zip -r -q yt-better-subscriptions-latest.zip . -x \
            '.git' '.git/*' '.github/*' '.gitignore' '.editorconfig' \
            'chrome_promo_tiles/*' 'store-assets/*' 'tests/*' 'tools/*' 'node_modules/*' 'coverage/*' 'pr-media/*' \
            'package.json' 'package-lock.json' 'jest.config.js' 'CLAUDE.md'
          unzip -Z1 yt-better-subscriptions-latest.zip
          if unzip -Z1 yt-better-subscriptions-latest.zip | grep -E '^(\.git|tests/|tools/|node_modules/|chrome_promo_tiles/|store-assets/)'; then
            echo "::error::Development files ended up in the ZIP"
            exit 1
          fi

      - name: Generate checksums
        run: |
          sha256sum yt-better-subscriptions-latest.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Get the version
        id: get_version
        run: echo "VERSION=${GITHUB_REF/refs\/tags\/v/}" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false

      - name: Upload Release Asset
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }} # This pulls from the CREATE RELEASE step above, referencing it's ID to get its outputs object, which include a `upload_url`. See this blog post for more info: https://jasonet.co/posts/new-features-of-github-actions/#passing-data-to-future-steps
          asset_path: ./yt-better-subscriptions-latest.zip
          asset_name: yt-better-subscriptions-${{ steps.get_version.outputs.VERSION }}.zip
          asset_content_type: application/zip

      - name: Upload checksums
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./SHA256SUMS.txt
          asset_name: SHA256SUMS.txt
          asset_content_type: text/plain

  # Uploads the release ZIP to the Chrome Web Store and Firefox Add-ons. To retry a store, or to
  # publish an older release, run "Publish to stores" by hand from the Actions tab.
  publish:
    name: Publish to stores
    needs: build
    permissions:
      contents: read
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
